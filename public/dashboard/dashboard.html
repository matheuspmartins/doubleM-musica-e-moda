<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>doubleM | Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

.header {
    background: #7c3aed;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
}

.container {
    padding: 20px;
}

.cards {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    flex: 1;
    text-align: center;
}

/* GRAFICOS */
.graficos {
    display: flex;
    gap: 20px;
}

.grafico {
    background: white;
    padding: 20px;
    border-radius: 10px;
    flex: 1;
}
</style>
</head>

<body>

<div class="header">
    <h2>Dashboard</h2>
    <span id="span_email">usuario@email.com</span>
</div>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>Respondentes</h3>
            <p>1248</p>
        </div>

        <div class="card">
            <h3>Hoje</h3>
            <p>87</p>
        </div>

        <div class="card">
            <h3>Músicas</h3>
            <p>1248</p>
        </div>

        <div class="card">
            <h3>Outfits</h3>
            <p>892</p>
        </div>
    </div>

    <div class="graficos">

        <div class="grafico">
            <h3>Perfis</h3>
            <canvas id="graficoPerfis"></canvas>
        </div>

        <div class="grafico">
            <h3>Músicas</h3>
            <canvas id="graficoMusicas"></canvas>
        </div>

    </div>

    <br>

    <div class="graficos">

        <div class="grafico">
            <h3>Gênero</h3>
            <canvas id="graficoGenero"></canvas>
        </div>

        <div class="grafico">
            <h3>Localização</h3>
            <canvas id="graficoLocalizacao"></canvas>
        </div>

    </div>

</div>

<script>
new Chart(document.getElementById('graficoPerfis'), {
    type: 'doughnut',
    data: {
        labels: ['Minimalista', 'Equilibrado', 'Estiloso', 'Experimental'],
        datasets: [{
            data: [28, 32, 23, 17]
        }]
    }
});

new Chart(document.getElementById('graficoMusicas'), {
    type: 'bar',
    data: {
        labels: ['Matuê', 'Teto', 'WIU', 'Travis Scott', 'Yeat'],
        datasets: [{
            label: 'Recomendações',
            data: [312, 278, 254, 198, 176]
        }]
    }
});

new Chart(document.getElementById('graficoGenero'), {
    type: 'pie',
    data: {
        labels: ['Masculino', 'Feminino', 'Outro'],
        datasets: [{
            data: [68, 30, 2]
        }]
    }
});

new Chart(document.getElementById('graficoLocalizacao'), {
    type: 'bar',
    data: {
        labels: ['SP', 'RJ', 'MG', 'BA', 'PR', 'Outros'],
        datasets: [{
            label: '%',
            data: [28, 18, 12, 8, 7, 27]
        }]
    }
});
</script>

</body>
</html>
