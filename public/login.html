<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>doubleM | Login</title>

<script src="./js/sessao.js"></script>

<link rel="icon" href="./assets/icon/favicon2.ico">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>

<body>

<nav>
    <div class="nav-left" onclick="window.location.href='index.html'">doubleM</div>

    <div class="nav-center">
        <button class="btn-home" onclick="window.location.href='index.html'">HOME</button>
        <button class="btn-quest" onclick="window.location.href='questionario.html'">QUESTIONÁRIO</button>
        <button class="btn-trap" onclick="window.location.href='dashboard/dashboard.html'">RESULTADOS</button>
    </div>

    <div class="nav-right">
        <button class="btn-login" onclick="window.location.href='login.html'">Login</button>
        <button class="btn-cadastro" onclick="window.location.href='cadastro.html'">Cadastro</button>
    </div>
</nav>

<div class="alerta_erro">
    <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
    </div>
</div>

<div class="login">
    <div class="card-login">
        <h2>Olá de volta!</h2>

        <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="email" placeholder="meuemail@provedor.com">
        </div>

        <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******">
        </div>

        <button class="botao" onclick="entrar()">Entrar</button>

        <div id="div_aguardar" class="loading-div">
            <img src="./assets/circle-loading.gif">
        </div>

        <div id="div_erros_login"></div>

        <p class="link-cadastro">
            Não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
    </div>
</div>

<div class="footer">
    2026 doubleM — Moda & Música
</div>

</body>
</html>

<script>

function entrar() {
    aguardar();

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos!";
        finalizarAguardar();
        return false;
    } else {
        setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    }).then(function (resposta) {

        if (resposta.ok) {
            resposta.json().then(function(json) {
                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.GENERO_MUSICAL_USUARIO = json.generoMusical;
                sessionStorage.ID_USUARIO = json.id;

                setTimeout(function () {
                    window.location = "./questionario.html";
                }, 1000);
            });

        } else {
            resposta.text().then(function(texto) {
                finalizarAguardar(texto);
            });
        }

    }).catch(function (erro) {
        console.log(erro);
        finalizarAguardar("Erro de conexão. Tente novamente.");
    });

    return false;
}

function sumirMensagem() {
    cardErro.style.display = "none";
}

</script>
