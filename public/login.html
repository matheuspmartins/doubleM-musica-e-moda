<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>doubleM | Login</title>

<script src="./js/sessao.js"></script>

<link rel="icon" href="./assets/icon/favicon2.ico">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    font-family: 'Poppins', sans-serif;
    color: white;
}

/* ===== NAV (HEADER DA HOME) ===== */
nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav-left {
    font-weight: bold;
    font-size: 18px;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
}

.nav-center {
    display: flex;
    gap: 20px;
}

.nav-right {
    display: flex;
    gap: 10px;
}

nav button {
    font-size: 14px;
    padding: 10px 18px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 1px;
    font-family: 'Poppins', sans-serif;
}

nav button:hover {
    transform: scale(1.08);
}

.btn-home { background: orangered; color: white; }
.btn-quest { background: #2f6f2f; color: white; }
.btn-trap { background: #65bce4; color: black; }

.btn-login {
    background: transparent;
    border: 1px solid white;
    color: white;
}

.btn-login:hover {
    background: white;
    color: black;
}

.btn-cadastro {
    background: orangered;
    color: white;
    font-weight: 600;
}

/* ===== LOGIN ===== */
.login {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
    min-height: calc(100vh - 70px);
}

.alerta_erro {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    width: 90%;
    max-width: 400px;
}

.card_erro {
    display: none;
    background: #ff4d4d;
    padding: 12px 16px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
}

.card-login {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 15px;
    width: 350px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
}

.card-login h2 {
    margin-bottom: 25px;
    font-family: 'Playfair Display', serif;
    font-size: 26px;
}

.campo {
    text-align: left;
    margin-bottom: 15px;
}

.campo span {
    font-size: 13px;
    opacity: 0.8;
}

.campo input {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #333;
    outline: none;
    background: #111;
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    transition: border-color 0.3s;
}

.campo input:focus {
    border-color: orangered;
}

.botao {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: orangered;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5px;
}

.botao:hover {
    transform: scale(1.03);
    background: #e63900;
}

.loading-div {
    display: none;
    margin-top: 15px;
}

.loading-div img {
    width: 40px;
}

#div_erros_login {
    margin-top: 10px;
    font-size: 13px;
    color: #ff6b6b;
}

.link-cadastro {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.6;
}

.link-cadastro a {
    color: orangered;
    text-decoration: none;
}

.footer {
    text-align: center;
    padding: 20px;
    opacity: 0.4;
    font-size: 13px;
}
</style>
</head>

<body>

<nav>
    <div class="nav-left" onclick="window.location.href='index.html'">doubleM</div>

    <div class="nav-center">
        <button class="btn-home" onclick="window.location.href='index.html'">HOME</button>
        <button class="btn-quest" onclick="window.location.href='questionario.html'">QUESTIONÁRIO</button>
        <button class="btn-trap" onclick="window.location.href='dashboard/dashboard.html'">TRAP</button>
    </div>

    <div class="nav-right">
        <button class="btn-login" onclick="window.location.href='login.html'">Login</button>
        <button class="btn-cadastro" onclick="window.location.href='cadastro.html'">Cadastro</button>
    </div>
</nav>

<div class="alerta_erro">
    <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
    </div>
</div>

<div class="login">
    <div class="card-login">
        <h2>Olá de volta!</h2>

        <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="email" placeholder="meuemail@provedor.com">
        </div>

        <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******">
        </div>

        <button class="botao" onclick="entrar()">Entrar</button>

        <div id="div_aguardar" class="loading-div">
            <img src="./assets/circle-loading.gif">
        </div>

        <div id="div_erros_login"></div>

        <p class="link-cadastro">
            Não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
    </div>
</div>

<div class="footer">
    2026 doubleM — Moda & Música
</div>

</body>
</html>

<script>

function entrar() {
    aguardar();

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos!";
        finalizarAguardar();
        return false;
    } else {
        setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    }).then(function (resposta) {

        if (resposta.ok) {
            resposta.json().then(function(json) {
                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.GENERO_MUSICAL_USUARIO = json.generoMusical;
                sessionStorage.ID_USUARIO = json.id;

                setTimeout(function () {
                    window.location = "./questionario.html";
                }, 1000);
            });

        } else {
            resposta.text().then(function(texto) {
                finalizarAguardar(texto);
            });
        }

    }).catch(function (erro) {
        console.log(erro);
        finalizarAguardar("Erro de conexão. Tente novamente.");
    });

    return false;
}

function sumirMensagem() {
    cardErro.style.display = "none";
}

</script>
